name: Java CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        # No `cache: maven` here: setup-java fails when the repo has no pom.xml yet.

    - name: Verify Environment
      run: |
        java -version
        python3 tools/tracker.py

    # Runs only once a Maven project (pom.xml) exists somewhere in the repository.
    - name: Build & Test Maven Projects
      if: hashFiles('**/pom.xml') != ''
      run: |
        find . -name pom.xml -not -path '*/target/*' -print0 |
          while IFS= read -r -d '' pom; do
            echo "::group::mvn verify $(dirname "$pom")"
            mvn -B -ntp -f "$pom" verify
            echo "::endgroup::"
          done
